name: Build unsigned IPA

# 每次推送到 main 或手动点 "Run workflow" 时, 在 GitHub 的 macOS 云端机器上
# 把 App 编译成未签名 IPA, 供 iLoader / SideStore 签名安装到 iPhone。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no code signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project GlobeApp.xcodeproj \
            -scheme GlobeApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/GlobeApp.app"
          test -d "$APP_PATH"
          rm -rf Payload GlobeApp-v1-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry GlobeApp-v1-unsigned.ipa Payload
          ls -lh GlobeApp-v1-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobeApp-v1-unsigned-ipa
          path: GlobeApp-v1-unsigned.ipa
          retention-days: 14
